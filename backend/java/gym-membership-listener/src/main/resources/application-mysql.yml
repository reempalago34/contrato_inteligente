# Perfil MySQL: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gimnasio?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:gimnasio}
    password: ${DB_PASSWORD:gimnasio}
    driver-class-name: com.mysql.cj.jdbc.Driver
